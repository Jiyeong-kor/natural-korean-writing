name: 기능 제안
description: 실제 글쓰기 상황에서 필요한 규칙이나 동작을 제안해 주세요.
title: "[제안] "
body:
  - type: markdown
    attributes:
      value: |
        실제로 겪는 문제와 원하는 동작을 중심으로 적어 주세요. 예문과 첨부 파일에는 개인정보, 인증 정보, 비공개 내용을 넣지 마세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 규칙이나 동작으로 해결되지 않는 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 실제 사용 사례
      description: 누가 어떤 글을 작성할 때 필요한지, 공개할 수 있는 예문과 함께 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: 원하는 동작
      description: 같은 입력에 어떤 결과가 나와야 하는지 적어 주세요. 유지해야 할 의미와 사실도 구분해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위 밖의 정보나 작업
      description: 제공하지 않은 사실의 추가, 외부 자료 조사, 비공개 정보 이용이나 도구 실행이 필요한지 적어 주세요. 필요하다면 종류와 이유만 설명하고 실제 비공개 정보는 적지 마세요. 필요하지 않다면 없다고 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 정보 확인
      options:
        - label: 본문과 첨부 파일에서 개인정보, 인증 정보, 비공개 내용을 제거했습니다.
          required: true
